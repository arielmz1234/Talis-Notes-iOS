name: TalisNotes
options:
  bundleIdPrefix: com.tali
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
packages:
  TaliCore:
    path: Packages/TaliCore
targets:
  TalisNotes:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: TaliCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tali.notes
        PRODUCT_NAME: TalisNotes
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Tali's Notes"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Tali's Notes"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [en, es, fr, pt-BR, ar, he]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts: [figtree.ttf, bricolage.ttf, heebo.ttf, vazirmatn.ttf]
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Picture
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "The camera is used only while it's open, for a photo of the board or a page. Photos stay on this device."
        NSMicrophoneUsageDescription: "The microphone is used only while you record a voice memo. Recordings stay on this device."
  TalisNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TalisNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tali.notes.uitests
        TEST_TARGET_NAME: TalisNotes
schemes:
  TalisNotes:
    build:
      targets:
        TalisNotes: all
    test:
      targets: [TalisNotesUITests]
