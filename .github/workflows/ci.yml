name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          ls /Applications | grep Xcode || true
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Core unit tests (TaliCore)
        run: set -o pipefail; swift test --package-path Packages/TaliCore 2>&1 | tail -60

      - name: Generate project
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project TalisNotes.xcodeproj -scheme TalisNotes \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO > build-log.txt 2>&1 || { grep -E "error:|warning: .*(Sources|UITests)/" build-log.txt | sort -u | head -150; tail -30 build-log.txt; exit 1; }
          tail -5 build-log.txt

      - name: Screenshots
        run: |
          mkdir -p shots
          ipad=$(sh scripts/sim.sh "iPad Pro 13" iPad)
          iphone=$(sh scripts/sim.sh "iPhone 16" iPhone)
          echo "iPad $ipad, iPhone $iphone"
          run() { # device tag dark lang
            TEST_RUNNER_SHOT_DIR="$PWD/shots" TEST_RUNNER_SHOT_TAG="$2" TEST_RUNNER_SHOT_DARK="$3" TEST_RUNNER_SHOT_LANG="$4" \
            xcodebuild test-without-building -project TalisNotes.xcodeproj -scheme TalisNotes \
              -destination "id=$1" -derivedDataPath build/dd -resultBundlePath "build/$2.xcresult" 2>&1 | tail -25
          }
          run "$ipad" ipad-light 0 ""
          run "$ipad" ipad-dark 1 ""
          run "$ipad" ipad-he 0 he
          run "$iphone" iphone-light 0 ""
          run "$iphone" iphone-dark 1 ""
          ls shots
          test "$(ls shots | wc -l)" -gt 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn

      - name: Unsigned .ipa (for sideloading)
        run: |
          set -o pipefail
          xcodebuild archive -project TalisNotes.xcodeproj -scheme TalisNotes -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/TalisNotes.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > archive-log.txt 2>&1 || { grep -E "error:" archive-log.txt | sort -u | head -100; tail -30 archive-log.txt; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R build/TalisNotes.xcarchive/Products/Applications/TalisNotes.app build/ipa/Payload/
          (cd build/ipa && zip -qr ../TalisNotes-unsigned.ipa Payload)
          ls -la build/TalisNotes-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TalisNotes-unsigned-ipa
          path: build/TalisNotes-unsigned.ipa
